<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tense Builder Game — AshyqLab</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); 
            color: #fff; 
            font-family: 'Roboto', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 38px; color: #38bdf8; text-shadow: 0 0 15px rgba(56,189,248,0.5); }
        .header p { color: #94a3b8; font-size: 16px; margin-top: 5px; }

        .hud {
            display: flex; justify-content: space-between; width: 100%; max-width: 800px;
            background: rgba(255,255,255,0.05); padding: 15px 25px; border-radius: 15px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px;
        }
        .hp-bar { display: flex; gap: 5px; align-items: center; }
        .heart { font-size: 24px; filter: drop-shadow(0 0 5px red); transition: all 0.3s; }
        .heart.lost { filter: grayscale(100%); opacity: 0.3; }
        
        .score { font-size: 24px; font-weight: 800; color: #38bdf8; }

        .game-area {
            width: 100%; max-width: 800px;
            background: rgba(0,0,0,0.3); border-radius: 20px;
            padding: 40px; text-align: center; border: 1px solid rgba(56,189,248,0.2);
            position: relative; overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .sentence { font-size: 26px; line-height: 1.6; margin-bottom: 30px; font-weight: 400; }
        .blank {
            display: inline-block; min-width: 100px; border-bottom: 3px solid #38bdf8;
            color: #38bdf8; font-weight: 800; padding: 0 10px; margin: 0 5px;
            transition: all 0.3s;
        }
        .blank.error { border-bottom-color: #ef4444; color: #ef4444; animation: shake 0.4s; }
        .blank.success { border-bottom-color: #4ade80; color: #4ade80; }

        .options {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 15px;
        }
        .option-btn {
            background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.4);
            color: #fff; font-family: inherit; font-size: 20px; font-weight: 600;
            padding: 12px 24px; border-radius: 10px; cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover { background: rgba(56,189,248,0.3); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(56,189,248,0.3); }

        .feedback { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-weight: 800; font-size: 20px; opacity: 0; transition: opacity 0.3s; }
        .feedback.correct { color: #4ade80; opacity: 1; }
        .feedback.wrong { color: #ef4444; opacity: 1; }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .btn-back { background: rgba(255,255,255,0.1); color: white; text-decoration: none; padding: 12px 24px; border-radius: 10px; font-weight: bold; margin-top: 30px; transition: 0.3s; }
        .btn-back:hover { background: rgba(255,255,255,0.2); }

        .screen-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .screen-overlay.active { opacity: 1; pointer-events: all; }
        .screen-overlay h2 { font-size: 50px; margin-bottom: 20px; }
        .btn-restart { background: #38bdf8; color: #0f172a; border: none; padding: 15px 30px; font-size: 20px; font-weight: 800; font-family: inherit; border-radius: 10px; cursor: pointer; }
    
/* MOBILE_RESPONSIVE_PATCH */

@media (max-width: 768px) {
    body { padding: 10px !important; }
    .game-card { padding: 16px 12px !important; }
    .timeline { overflow-x: auto !important; -webkit-overflow-scrolling: touch; }
}

</style>

    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="header">
        <h1>⏳ Tense Hero</h1>
        <p>Complete the sentences with the correct verb forms!</p>
    </div>

    <div class="hud">
        <div class="hp-bar" id="hpBar">
            <span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span>
        </div>
        <div class="score">Score: <span id="scoreVal">0</span></div>
    </div>

    <div class="game-area">
        <div class="feedback" id="feedback">Awesome!</div>
        <div class="sentence" id="sentenceBox">Loading...</div>
        <div class="options" id="optionsBox"></div>
    </div>

    <a href="index.html" class="btn-back">← Back to Lobby</a>

    <div class="screen-overlay" id="gameOver">
        <h2 style="color: #ef4444;">Game Over!</h2>
        <p style="font-size: 24px; margin-bottom: 30px;">Final Score: <span id="finalScore">0</span></p>
        <button class="btn-restart" onclick="startGame()">Try Again</button>
    </div>

    <script>
        const questions = [
            { s: "I {blank} a book when the phone rang.", o: ["was reading", "am reading", "read", "have read"], a: 0 },
            { s: "She normally {blank} coffee, but today she's drinking tea.", o: ["drink", "drinks", "is drinking", "drank"], a: 1 },
            { s: "We {blank} to Paris three times already.", o: ["went", "have gone", "have been", "were going"], a: 2 },
            { s: "By the time we arrive, the movie {blank}.", o: ["will start", "started", "will have started", "is starting"], a: 2 },
            { s: "Look at those clouds! It {blank} rain.", o: ["will", "is going to", "rains", "is raining"], a: 1 },
            { s: "I {blank} him since we were kids.", o: ["know", "knew", "am knowing", "have known"], a: 3 },
            { s: "What {blank} at 8 PM tomorrow?", o: ["will you do", "do you do", "will you be doing", "are you doing"], a: 2 },
            { s: "While I was studying, my brother {blank} video games.", o: ["played", "was playing", "has played", "plays"], a: 1 },
            { s: "He {blank} out of the house before I could stop him.", o: ["runs", "has run", "ran", "was running"], a: 2 },
            { s: "They {blank} on this project for three months.", o: ["work", "have been working", "are working", "worked"], a: 1 }
        ];

        let lives = 3;
        let score = 0;
        let currentQ = {};

        function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

        function startGame() {
            lives = 3; score = 0;
            document.getElementById('gameOver').classList.remove('active');
            updateHUD();
            nextQuestion();
        }

        function nextQuestion() {
            currentQ = shuffle(questions)[0];
            const sentenceHTML = currentQ.s.replace('{blank}', '<span class="blank" id="blankWord">...</span>');
            document.getElementById('sentenceBox').innerHTML = sentenceHTML;

            const optsBox = document.getElementById('optionsBox');
            optsBox.innerHTML = '';
            
            // To randomize button positions but keep track of right answer
            let opts = currentQ.o.map((opt, i) => ({ text: opt, isCorrect: i === currentQ.a }));
            shuffle(opts).forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt.text;
                btn.onclick = () => handleAnswer(opt.isCorrect, opt.text, btn);
                optsBox.appendChild(btn);
            });
        }

        function handleAnswer(isCorrect, text, btnEl) {
            const blank = document.getElementById('blankWord');
            const feedback = document.getElementById('feedback');
            document.querySelectorAll('.option-btn').forEach(b => b.style.pointerEvents = 'none'); // disable clicks
            
            blank.textContent = text;

            if (isCorrect) {
                score += 10;
                blank.className = 'blank success';
                feedback.textContent = 'Correct! +10';
                feedback.className = 'feedback correct';
                setTimeout(() => { feedback.className = 'feedback'; nextQuestion(); }, 1200);
            } else {
                lives--;
                blank.className = 'blank error';
                btnEl.style.background = 'rgba(239,68,68,0.3)';
                btnEl.style.borderColor = '#ef4444';
                feedback.textContent = 'Oops! Wrong Tense!';
                feedback.className = 'feedback wrong';
                setTimeout(() => {
                    feedback.className = 'feedback';
                    if (lives <= 0) {
                        endGame();
                    } else {
                        nextQuestion();
                    }
                }, 1500);
            }
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('scoreVal').textContent = score;
            const hearts = document.querySelectorAll('.heart');
            hearts.forEach((h, i) => {
                h.className = i < lives ? 'heart' : 'heart lost';
            });
        }

        function endGame() {
            document.getElementById('gameOver').classList.add('active');
            document.getElementById('finalScore').textContent = score;
        }

        startGame();
    </script>



\n    <script src="ashyq-nav.js"></script>
</body>
</html>
