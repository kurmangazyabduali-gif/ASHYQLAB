<!DOCTYPE html>
<html lang="kk" translate="no" class="notranslate">

<head>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Қазақ тілі: Сөздік</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .flashcard {
            width: 400px;
            height: 250px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .card-front {
            background: linear-gradient(135deg, #00cccc 0%, #006666 100%);
        }

        .card-back {
            background: linear-gradient(135deg, #eee 0%, #ccc 100%);
            color: #333;
            transform: rotateY(180deg);
        }

        .word-main {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .word-hint {
            font-size: 1rem;
            opacity: 0.8;
        }

        .word-trans {
            font-size: 2.5rem;
            color: #333;
            font-weight: 700;
        }

        /* INFO BOX (Rules) */
        .info-box {
            position: absolute;
            top: 100px;
            right: 20px;
            width: 250px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--accent-secondary);
            border-radius: 15px;
            padding: 15px;
            color: #ddd;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            z-index: 50;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transition: opacity 0.5s;
        }

        .info-box h3 {
            color: var(--accent-secondary);
            margin-bottom: 10px;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
        }

        .btn-close-info {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* HIDE ON MOBILE */
        @media (max-width: 768px) {
            .info-box {
                display: none !important;
            }
        }

        .category-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 90px;
            z-index: 10;
        }

        .cat-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cat-btn.active {
            background: #00cccc;
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 204, 204, 0.4);
        }

        .progress-container {
            position: absolute;
            top: 70px;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
        }

        .progress-bar {
            height: 100%;
            background: #00cccc;
            width: 0%;
            transition: width 0.3s;
        }

        .controls-row {
            position: absolute;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .btn-round {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-miss {
            background: #ff4d4d;
            color: white;
        }

        .btn-know {
            background: #00cc66;
            color: white;
        }

        .btn-round:hover {
            transform: scale(1.1);
        }

        .btn-round:active {
            transform: scale(0.95);
        }

        .btn-speak {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            z-index: 5;
        }

        .btn-speak:hover {
            color: #fff;
            transform: scale(1.1);
        }

        .card-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            perspective: 1000px;
        }

        /* Kaz Pattern Overlay */
        .kaz-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            background-image:
                url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHBhdGggZD0iTTIwIDIwIEwwIDAgTTAgNDAgTDIwIDIwIEw0MCA0MCBMNDAgMCBMMjAgMjAiIHN0cm9rZT0iI2ZmZiIgZmlsbD0ibm9uZSIvPjwvc3ZnPg==');
            pointer-events: none;
        }
    </style>

    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="lab-lobby kaz-theme">
    <div class="app-container">
        <header class="glass-header">
            <div class="header-left">
                <a href="index.html#kazakh" class="btn-back" title="Меню">⬅</a>
                <h1>Сөздік <span class="accent" style="color: #00cccc;">Карточкалары</span></h1>
            </div>
            <div class="header-right">
                <span id="counter">1 / 10</span>
            </div>
        </header>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <main class="simulation-container" style="background: transparent;">
            <div class="kaz-pattern"></div>

            <!-- VOCABULARY SECTION -->
            <div id="section-vocab" style="width:100%; height:100%">

                <!-- Info Box for Vocab -->
                <div id="info-vocab" class="info-box">
                    <h3>Ереже (Правила) <button class="btn-close-info"
                            onclick="this.parentElement.parentElement.style.opacity='0'">×</button></h3>
                    <p>Карточкадағы сөзді оқып, оның <b>Антонимін</b> (қарама-қарсы сөзді) тап.</p>
                    <p style="margin-top:10px; font-size:0.8em; color:#aaa;">Мысалы: <br>Ақ (Белый) ➡ Қара (Черный)</p>
                </div>

                <div class="category-bar">
                    <div class="cat-btn active" data-cat="antonyms">↔️ Антонимдер</div>
                    <div class="cat-btn" data-cat="family">👨‍👩‍👧‍👦 Отбасы</div>
                </div>

                <div class="card-container">
                    <div class="flashcard" id="flashcard">
                        <div class="card-face card-front">
                            <button class="btn-speak" id="btn-speak" title="Озвучить"
                                onclick="event.stopPropagation()">🔊</button>
                            <div class="word-main" id="word-front">Сәлем</div>
                            <div class="word-hint">Басу -> Аударымы</div>
                        </div>
                        <div class="card-face card-back">
                            <div class="word-trans" id="word-back">Привет</div>
                        </div>
                    </div>
                </div>

                <div class="controls-row">
                    <button id="btn-miss" class="btn-round btn-miss" title="Қайталау (Не знаю)">👎</button>
                    <div style="width: 50px"></div> <!-- Spacer -->
                    <button id="btn-know" class="btn-round btn-know" title="Білемін (Знаю)">👍</button>
                </div>

                <button id="btn-reset" class="btn primary"
                    style="position:absolute; bottom:50px; display:none; left: 50%; transform: translateX(-50%);">↻
                    Басынан
                    бастау</button>
            </div>

        </main>
    </div>
    <script>
        const LANG = 'kk';
    </script>
    <script src="cards.js"></script>

</body>

</html>
