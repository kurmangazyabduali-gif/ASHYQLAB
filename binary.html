<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Двоичный код — AshyqLab</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Roboto', sans-serif; }
        .lab-container { background: rgba(30, 41, 59, 0.8); padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.5); border: 1px solid rgba(59, 130, 246, 0.3); width: 90%; max-width: 900px; }
        h1 { margin-top: 0; font-size: 36px; color: #3b82f6; }
        .bits-container { display: flex; justify-content: center; gap: 15px; margin: 40px 0; flex-wrap: wrap; }
        .bit-box { background: rgba(0,0,0,0.5); border: 2px solid #334155; border-radius: 12px; padding: 20px; width: 60px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; }
        .bit-box:hover { transform: translateY(-5px); border-color: #3b82f6; }
        .bit-box.active { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        .bit-value { font-size: 48px; font-weight: 800; color: #475569; }
        .bit-box.active .bit-value { color: #60a5fa; text-shadow: 0 0 10px rgba(96, 165, 250, 0.8); }
        .bit-power { font-size: 16px; color: #94a3b8; margin-top: 10px; font-weight: bold; }
        .result-panel { background: rgba(0,0,0,0.4); border-radius: 12px; padding: 20px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.05); }
        .result-value { font-size: 64px; font-weight: 800; color: #fff; margin: 10px 0; letter-spacing: 2px; }
        .btn-back { display: inline-block; background: rgba(255,255,255,0.1); color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; transition: all 0.3s ease; }
        .btn-back:hover { background: rgba(255,255,255,0.2); }
        .equation { font-size: 18px; color: #cbd5e1; min-height: 25px; margin-top: 10px;}
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .btn-action { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-action:hover { background: #2563eb; }
    </style>

    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="lab-container">
        <h1>🔢 Двоичный код</h1>
        <p>Нажимайте на блоки, чтобы переключать биты (0 и 1) и смотрите, как формируется десятичное число.</p>
        
        <div class="controls">
            <button class="btn-action" onclick="resetAll()">Сбросить всё (0)</button>
            <button class="btn-action" onclick="setAll()">Включить всё (255)</button>
            <button class="btn-action" onclick="randomBits()">Случайное число</button>
        </div>

        <div class="bits-container" id="bitsContainer">
            <!-- JavaScript will populate this -->
        </div>

        <div class="result-panel">
            <div>Десятичное (Decimal) значение:</div>
            <div class="result-value" id="decimalResult">0</div>
            <div class="equation" id="equationObj">0 = 0</div>
        </div>

        <a href="index.html" class="btn-back">← Вернуться в лобби</a>
    </div>

    <script>
        const container = document.getElementById('bitsContainer');
        const decimalResult = document.getElementById('decimalResult');
        const equationObj = document.getElementById('equationObj');
        const numBits = 8;
        let bits = new Array(numBits).fill(0);

        function renderBits() {
            container.innerHTML = '';
            for(let i=0; i<numBits; i++) {
                const power = Math.pow(2, numBits - 1 - i);
                const bitBox = document.createElement('div');
                bitBox.className = `bit-box ${bits[i] ? 'active' : ''}`;
                bitBox.onclick = () => toggleBit(i);
                
                bitBox.innerHTML = `
                    <div class="bit-value">${bits[i]}</div>
                    <div class="bit-power">${power}</div>
                `;
                container.appendChild(bitBox);
            }
            calculateResult();
        }

        function toggleBit(index) {
            bits[index] = bits[index] === 0 ? 1 : 0;
            renderBits();
        }

        function calculateResult() {
            let total = 0;
            let eqParts = [];
            for(let i=0; i<numBits; i++) {
                if(bits[i] === 1) {
                    const val = Math.pow(2, numBits - 1 - i);
                    total += val;
                    eqParts.push(val);
                }
            }
            decimalResult.textContent = total;
            equationObj.textContent = eqParts.length > 0 ? eqParts.join(' + ') + ` = ${total}` : '0 = 0';
        }

        function resetAll() {
            bits.fill(0);
            renderBits();
        }
        
        function setAll() {
            bits.fill(1);
            renderBits();
        }

        function randomBits() {
            for(let i=0; i<numBits; i++) {
                bits[i] = Math.random() > 0.5 ? 1 : 0;
            }
            renderBits();
        }

        renderBits();
    </script>



\n    <script src="ashyq-nav.js"></script>
</body>
</html>
