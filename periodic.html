                opacity: 0;
                transform: scale(0.85);

                opacity: 1;
                transform: scale(1);

        // Build grid (18 columns × 9 rows for main + 2 rows for f-block)
        function buildTable() {
            const grid = document.getElementById('ptGrid');

            // Init 9-row grid with 18 columns
            const cells = {};
            const ROWS = 9, COLS = 18;

            for (const el of ELEMENTS) {
                const [Z, sym, name, row, col, mass, cat, state, melt, boil, dens, cfg] = el;
                let r = row, c = col;
                if (r === 'La') { r = 8; c = c + 3; }   // lanthanides row index 8
                if (r === 'Ac') { r = 9; c = c + 3; }   // actinides row index 9
                cells[`${r},${c}`] = el;
            }

            let html = '';

            // Main rows 1–7
            for (let r = 1; r <= 7; r++) {
                for (let c = 1; c <= 18; c++) {
                    const key = `${r},${c}`;
                    if (cells[key]) {
                        const el = cells[key];
                        html += elCell(el);
                    } else if (r === 6 && c === 3) {
                        html += `<div class="el-cell el-label" style="font-size:0.5em;line-height:1.2;color:#666;">57–71<br>Ln</div>`;
                    } else if (r === 7 && c === 3) {
                        html += `<div class="el-cell el-label" style="font-size:0.5em;line-height:1.2;color:#666;">89–103<br>An</div>`;
                    } else {
                        html += `<div class="el-cell el-empty"></div>`;
                    }
                }
            }

            // Spacer row
            html += `<div style="grid-column:1/-1;height:12px"></div>`;

            // Lanthanide row (f-block)
            for (let c = 1; c <= 18; c++) {
                const key = `8,${c}`;
                if (cells[key]) {
                    html += elCell(cells[key]);
                } else if (c === 1) {
                    html += `<div class="el-cell el-empty"></div>`;
                } else if (c === 2) {
                    html += `<div class="el-cell el-label">Ln</div>`;
                } else if (c >= 3) {
                    html += `<div class="el-cell el-empty"></div>`;
                }
            }

            // Actinide row
            for (let c = 1; c <= 18; c++) {
                const key = `9,${c}`;
                if (cells[key]) {
                    html += elCell(cells[key]);
                } else if (c === 1) {
                    html += `<div class="el-cell el-empty"></div>`;
                } else if (c === 2) {
                    html += `<div class="el-cell el-label">An</div>`;
                } else if (c >= 3) {
                    html += `<div class="el-cell el-empty"></div>`;
                }
            }

            grid.innerHTML = html;
        }

        function elCell(el) {
            const [Z, sym, name, row, col, mass, cat] = el;
            const cls = (CATS[cat] || { cls: '' }).cls;
            return `<div class="el-cell ${cls}" onclick="showModal(${Z})" title="${name}">
        <span class="el-num">${Z}</span>
        <span class="el-sym">${sym}</span>
        <span class="el-name-short">${name.length > 8 ? name.slice(0, 7) + '…' : name}</span>
    </div>`;
        }

        function buildLegend() {
            const el = document.getElementById('ptLegend');
            el.innerHTML = Object.entries(CATS).map(([k, v]) =>
                `<div class="legend-item">
            <div class="legend-dot ${v.cls}" style="background:var(--dot-bg)"></div>
            <span>${v.name}</span>
        </div>`
            ).join('');
            // apply category colors to legend dots
            document.querySelectorAll('.legend-item').forEach((item, i) => {
                const catCls = Object.values(CATS)[i].cls;
                item.querySelector('.legend-dot').className = `legend-dot ${catCls}`;
                item.querySelector('.legend-dot').style.opacity = '1';
            });
        }

        function showModal(Z) {
            const el = ELEMENTS.find(e => e[0] === Z);
            if (!el) return;
            const [z, sym, name, row, col, mass, cat, state, melt, boil, dens, cfg] = el;

            const catInfo = CATS[cat] || {};
            const fmt = v => (v === '—' || v == null) ? '—' : v;

            document.getElementById('holoCore').textContent = sym;
            document.getElementById('mName').textContent = name;
            document.getElementById('mNum').textContent = `Атомный номер: ${z}`;
            document.getElementById('mMass').textContent = `${mass} а.е.м.`;
            const catEl = document.getElementById('mCat');
            catEl.textContent = catInfo.name || cat;
            catEl.className = `el-modal-cat ${catInfo.cls || ''}`;
            catEl.style.background = '';

            document.getElementById('mGroup').textContent = typeof col === 'number' ? col : '—';
            document.getElementById('mPeriod').textContent = typeof row === 'number' ? row : '—';
            document.getElementById('mState').textContent = fmt(state);
            document.getElementById('mMelt').textContent = fmt(melt) + (melt !== '—' && melt != null ? ' °C' : '');
            document.getElementById('mBoil').textContent = fmt(boil) + (boil !== '—' && boil != null ? ' °C' : '');
            document.getElementById('mDens').textContent = fmt(dens) + (dens && dens !== '—' ? ' г/см³' : '');
            document.getElementById('mConfigVal').textContent = cfg;

            document.getElementById('elModal').style.display = 'flex';
        }

        function closeModal(e) {
            if (e.target === document.getElementById('elModal')) closeModalDirect();
        }
        function closeModalDirect() {
            document.getElementById('elModal').style.display = 'none';
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

        buildTable();
        buildLegend();
    </script>
