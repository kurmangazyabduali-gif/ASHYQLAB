<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алгоритмы сортировки — AshyqLab</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Roboto', sans-serif; }
        .lab-container { background: rgba(30, 41, 59, 0.8); padding: 40px; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); border: 1px solid rgba(59, 130, 246, 0.3); width: 95%; max-width: 1000px; }
        h1 { margin-top: 0; font-size: 32px; color: #3b82f6; text-align: center;}
        
        .array-container { display: flex; align-items: flex-end; justify-content: center; height: 300px; gap: 4px; margin: 30px 0; padding: 20px; background: rgba(0,0,0,0.4); border-radius: 12px; }
        .array-bar { width: 30px; background: #60a5fa; border-radius: 4px 4px 0 0; display: flex; align-items: flex-end; justify-content: center; color: transparent; font-size: 10px; font-weight: bold; transition: height 0.2s, background-color 0.2s; }
        .array-bar.active { background: #f59e0b; }
        .array-bar.sorted { background: #10b981; }
        .array-bar.swapping { background: #ef4444; }

        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .btn-action { background: #334155; color: white; border: 1px solid rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-action:hover { background: #475569; }
        .btn-primary { background: #3b82f6; border: none; }
        .btn-primary:hover { background: #2563eb; }
        .btn-primary:disabled { background: #1e3a8a; cursor: not-allowed; opacity: 0.7; }
        
        .speed-control { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 8px; }
        input[type=range] { cursor: pointer; }
        
        .btn-back { display: block; width: max-content; margin: 20px auto 0; background: rgba(255,255,255,0.1); color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; transition: all 0.3s ease; }
        .btn-back:hover { background: rgba(255,255,255,0.2); }
    </style>

    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="lab-container">
        <h1>📊 Визуализация Алгоритмов</h1>
        
        <div class="controls">
            <button class="btn-action" onclick="generateArray()" id="btnGenerate">Новый массив</button>
            <div class="speed-control">
                <label for="speedSlider">Скорость:</label>
                <input type="range" id="speedSlider" min="10" max="500" value="100" style="direction: rtl;">
            </div>
            <button class="btn-action btn-primary" onclick="bubbleSort()" id="btnBubble">Сортировка Пузырьком</button>
            <button class="btn-action btn-primary" onclick="insertionSort()" id="btnInsertion">Сортировка Вставками</button>
        </div>

        <div class="array-container" id="arrayContainer"></div>

        <a href="index.html" class="btn-back">← Вернуться в лобби</a>
    </div>

    <script>
        const container = document.getElementById('arrayContainer');
        const speedSlider = document.getElementById('speedSlider');
        let array = [];
        const SIZE = 20;
        let isSorting = false;

        function getDelay() {
            return parseInt(speedSlider.value);
        }

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        function generateArray() {
            if(isSorting) return;
            array = [];
            container.innerHTML = '';
            for(let i=0; i<SIZE; i++) {
                const val = Math.floor(Math.random() * 90) + 10;
                array.push(val);
                const bar = document.createElement('div');
                bar.classList.add('array-bar');
                bar.style.height = `${val * 3}px`;
                container.appendChild(bar);
            }
        }

        function setButtonsState(disabled) {
            isSorting = disabled;
            document.getElementById('btnGenerate').disabled = disabled;
            document.getElementById('btnBubble').disabled = disabled;
            document.getElementById('btnInsertion').disabled = disabled;
        }

        async function bubbleSort() {
            if(isSorting) return;
            setButtonsState(true);
            const bars = document.getElementsByClassName('array-bar');
            
            for(let i=0; i<array.length - 1; i++) {
                for(let j=0; j<array.length - i - 1; j++) {
                    bars[j].classList.add('active');
                    bars[j+1].classList.add('active');
                    await sleep(getDelay());
                    
                    if(array[j] > array[j+1]) {
                        bars[j].classList.replace('active', 'swapping');
                        bars[j+1].classList.replace('active', 'swapping');
                        await sleep(getDelay());
                        
                        // Swap
                        let temp = array[j];
                        array[j] = array[j+1];
                        array[j+1] = temp;
                        
                        bars[j].style.height = `${array[j] * 3}px`;
                        bars[j+1].style.height = `${array[j+1] * 3}px`;
                        
                        bars[j].classList.replace('swapping', 'active');
                        bars[j+1].classList.replace('swapping', 'active');
                    }
                    
                    bars[j].classList.remove('active');
                    bars[j+1].classList.remove('active');
                }
                bars[array.length - 1 - i].classList.add('sorted');
            }
            bars[0].classList.add('sorted');
            setButtonsState(false);
        }

        async function insertionSort() {
            if(isSorting) return;
            setButtonsState(true);
            const bars = document.getElementsByClassName('array-bar');
            
            bars[0].classList.add('sorted');
            for(let i=1; i<array.length; i++) {
                let key = array[i];
                let j = i - 1;
                
                bars[i].classList.add('swapping');
                await sleep(getDelay());
                
                while(j >= 0 && array[j] > key) {
                    bars[j].classList.add('active');
                    await sleep(getDelay());
                    
                    array[j+1] = array[j];
                    bars[j+1].style.height = `${array[j+1] * 3}px`;
                    
                    bars[j].classList.remove('active');
                    j = j - 1;
                }
                array[j+1] = key;
                bars[j+1].style.height = `${key * 3}px`;
                bars[i].classList.remove('swapping');
                
                for(let k=0; k<=i; k++) {
                    bars[k].classList.add('sorted');
                }
            }
            setButtonsState(false);
        }

        generateArray();
    </script>



\n    <script src="ashyq-nav.js"></script>
</body>
</html>
