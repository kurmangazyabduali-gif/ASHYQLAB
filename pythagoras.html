<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">
<head>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Теорема Пифагора — AshyqLab</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Roboto', sans-serif; overflow: hidden; }
        .lab-container { background: rgba(30, 41, 59, 0.8); padding: 40px; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); border: 1px solid rgba(139, 92, 246, 0.3); width: 95%; max-width: 1000px; text-align: center; }
        h1 { margin-top: 0; font-size: 32px; color: #8b5cf6; }
        
        .interactive-area { display: flex; flex-wrap: wrap; justify-content: space-around; align-items: center; gap: 30px; margin: 30px 0; }
        
        .canvas-container { position: relative; width: 400px; height: 400px; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        canvas { position: absolute; top: 0; left: 0; cursor: crosshair; }
        
        .controls-panel { background: rgba(0,0,0,0.4); padding: 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); width: 300px; text-align: left; }
        .slider-group { margin-bottom: 20px; }
        .slider-group label { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; color: #cbd5e1; }
        .slider-group span { color: #8b5cf6; }
        input[type=range] { width: 100%; cursor: pointer; }
        
        .equation-box { background: rgba(139, 92, 246, 0.1); border: 2px solid #8b5cf6; border-radius: 8px; padding: 20px; text-align: center; margin-top: 20px; }
        .equation-box h2 { margin: 0 0 10px 0; font-size: 24px; color: #fff; }
        .formula { font-size: 28px; font-weight: 800; color: #a78bfa; letter-spacing: 2px; }
        
        .btn-back { display: inline-block; margin-top: 20px; background: rgba(255,255,255,0.1); color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; transition: all 0.3s ease; }
        .btn-back:hover { background: rgba(255,255,255,0.2); }
    </style>

    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="lab-container">
        <h1>📐 Теорема Пифагора</h1>
        <p>Изменяйте длины катетов <b>a</b> и <b>b</b>, чтобы увидеть, как пересчитывается гипотенуза <b>c</b> (c² = a² + b²).</p>
        
        <div class="interactive-area">
            <div class="canvas-container">
                <canvas id="triangleCanvas" width="400" height="400"></canvas>
            </div>
            
            <div class="controls-panel">
                <div class="slider-group">
                    <label>Катет a: <span id="valA">3</span></label>
                    <input type="range" id="sliderA" min="1" max="15" value="3" step="1">
                </div>
                <div class="slider-group">
                    <label>Катет b: <span id="valB">4</span></label>
                    <input type="range" id="sliderB" min="1" max="15" value="4" step="1">
                </div>
                
                <div class="equation-box">
                    <h2>a² + b² = c²</h2>
                    <div class="formula" id="formulaDisplay">3² + 4² = c²</div>
                    <div class="formula" id="resultDisplay" style="color: #4ade80; margin-top:10px;">c = 5</div>
                </div>
            </div>
        </div>

        <a href="index.html" class="btn-back">← Вернуться в лобби</a>
    </div>

    <script>
        const canvas = document.getElementById('triangleCanvas');
        const ctx = canvas.getContext('2d');
        const sliderA = document.getElementById('sliderA');
        const sliderB = document.getElementById('sliderB');
        const valA = document.getElementById('valA');
        const valB = document.getElementById('valB');
        const formulaDisplay = document.getElementById('formulaDisplay');
        const resultDisplay = document.getElementById('resultDisplay');

        const scale = 20;
        const originX = 50;
        const originY = 350;

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "rgba(255,255,255,0.1)";
            ctx.lineWidth = 1;

            for(let x=0; x<=canvas.width; x+=scale) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for(let y=0; y<=canvas.height; y+=scale) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        function update() {
            let a = parseInt(sliderA.value);
            let b = parseInt(sliderB.value);
            let c = Math.sqrt(a*a + b*b);

            valA.textContent = a;
            valB.textContent = b;
            
            formulaDisplay.textContent = `${a}² + ${b}² = c²`;
            formulaDisplay.innerHTML += `<br><span style="font-size: 20px; color:#cbd5e1;">${a*a} + ${b*b} = ${a*a + b*b}</span>`;
            
            resultDisplay.textContent = `c = ${c % 1 === 0 ? c : c.toFixed(2)}`;

            drawGrid();

            const endX = originX + b * scale;
            const endY = originY - a * scale;

            // Draw right angle symbol
            ctx.strokeStyle = "#8b5cf6";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(originX + 15, originY);
            ctx.lineTo(originX + 15, originY - 15);
            ctx.lineTo(originX, originY - 15);
            ctx.stroke();

            // Draw Triangle
            ctx.fillStyle = "rgba(139, 92, 246, 0.2)";
            ctx.beginPath();
            ctx.moveTo(originX, originY);        // Right angle point
            ctx.lineTo(endX, originY);           // line b
            ctx.lineTo(originX, endY);           // line c (hypotenuse ending point)
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.lineWidth = 4;
            // a
            ctx.strokeStyle = "#ef4444";
            ctx.beginPath(); ctx.moveTo(originX, originY); ctx.lineTo(originX, endY); ctx.stroke();
            // b
            ctx.strokeStyle = "#3b82f6";
            ctx.beginPath(); ctx.moveTo(originX, originY); ctx.lineTo(endX, originY); ctx.stroke();
            // c
            ctx.strokeStyle = "#10b981";
            ctx.beginPath(); ctx.moveTo(originX, endY); ctx.lineTo(endX, originY); ctx.stroke();

            // Labels
            ctx.font = "bold 16px Roboto";
            ctx.fillStyle = "#ef4444";
            ctx.fillText(`a=${a}`, originX - 30, originY - (a*scale)/2);
            
            ctx.fillStyle = "#3b82f6";
            ctx.fillText(`b=${b}`, originX + (b*scale)/2 - 15, originY + 25);
            
            ctx.fillStyle = "#10b981";
            ctx.save();
            ctx.translate(originX + (b*scale)/2, originY - (a*scale)/2);
            let angle = Math.atan2(a, b);
            
            ctx.fillText(`c=${c % 1 === 0 ? c : c.toFixed(1)}`, 10, -10);
            ctx.restore();
        }

        sliderA.addEventListener('input', update);
        sliderB.addEventListener('input', update);

        update();
    </script>



\n    <script src="ashyq-nav.js"></script>
</body>
</html>
