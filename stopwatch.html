<!DOCTYPE html>
<html lang="kk">
<head>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Секундомер — AshyqLab</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Roboto', sans-serif; }
        .stopwatch-container { background: linear-gradient(145deg, #1e293b, #0f172a); padding: 40px; border-radius: 40px; text-align: center; box-shadow:  20px 20px 60px #0a0f1c, -20px -20px 60px #141f38; border: 1px solid rgba(0, 203, 169, 0.2); width: 90%; max-width: 500px; display: flex; flex-direction: column; align-items: center; }
        .time-display { font-family: 'JetBrains Mono', monospace; font-size: 64px; font-weight: 700; color: #00cba9; text-shadow: 0 0 20px rgba(0, 203, 169, 0.5); margin: 30px 0; font-variant-numeric: tabular-nums; }
        .ms-display { font-size: 32px; color: #94a3b8; }
        .controls { display: flex; gap: 20px; margin-bottom: 30px; }
        .btn-sw { width: 80px; height: 80px; border-radius: 50%; border: none; font-family: 'Roboto', sans-serif; font-weight: bold; font-size: 16px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn-start { background: #10b981; color: white; }
        .btn-start:hover { background: #059669; box-shadow: 0 0 20px rgba(16, 185, 129, 0.6); }
        .btn-stop { background: #ef4444; color: white; display: none; }
        .btn-stop:hover { background: #dc2626; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }
        .btn-lap { background: #334155; color: white; }
        .btn-lap:hover { background: #475569; }
        .btn-reset { background: #3b82f6; color: white; display: none;}
        .btn-reset:hover { background: #2563eb; }
        
        .laps-container { width: 100%; max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 10px; margin-top: 20px; }
        .lap-item { display: flex; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); font-family: 'JetBrains Mono', monospace; font-size: 16px;}
        .lap-item:last-child { border-bottom: none; }
        .lap-number { color: #94a3b8; }
        .lap-time { color: #00cba9; font-weight: bold; }
        .lap-diff { color: #f59e0b; }
        
        .laps-container::-webkit-scrollbar { width: 6px; }
        .laps-container::-webkit-scrollbar-track { background: transparent; }
        .laps-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        .btn-back { display: inline-block; margin-top: 30px; background: rgba(255,255,255,0.1); color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; transition: all 0.3s ease; }
        .btn-back:hover { background: rgba(255,255,255,0.2); }
    </style>

    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="stopwatch-container">
        <div style="display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:15px;">
            <a href="index.html" style="color:#cbd5e1; text-decoration:none; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.06); padding:6px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.1);">
                ← Басты бет
            </a>
            <div class="lang-segmented-control">
                <button class="lang-segment" data-lang="ru" onclick="setLang('ru')">RU</button>
                <button class="lang-segment active" data-lang="kk" onclick="setLang('kk')">ҚАЗ</button>
                <button class="lang-segment" data-lang="en" onclick="setLang('en')">EN</button>
            </div>
        </div>
        <h2 style="margin:0; color: #94a3b8; font-weight: 500;">⏱️ Секундомер</h2>
        
        <div class="time-display" id="display">
            <span id="min">00</span>:<span id="sec">00</span>.<span class="ms-display" id="ms">00</span>
        </div>
        
        <div class="controls">
            <button class="btn-sw btn-lap" id="lapBtn" onclick="lap()">Круг</button>
            <button class="btn-sw btn-reset" id="resetBtn" onclick="reset()">Сброс</button>
            <button class="btn-sw btn-start" id="startBtn" onclick="start()">Старт</button>
            <button class="btn-sw btn-stop" id="stopBtn" onclick="stop()">Стоп</button>
        </div>
        
        <div class="laps-container" id="lapsList">
            <!-- Laps go here -->
        </div>

        <a href="index.html" class="btn-back">← Вернуться в лобби</a>
    </div>

    <script>
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval;
        let running = false;
        let laps = [];
        let lastLapTime = 0;

        const displayMin = document.getElementById('min');
        const displaySec = document.getElementById('sec');
        const displayMs = document.getElementById('ms');
        
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const lapBtn = document.getElementById('lapBtn');
        const resetBtn = document.getElementById('resetBtn');
        const lapsList = document.getElementById('lapsList');

        function formatTime(time) {
            let date = new Date(time);
            let m = date.getUTCMinutes().toString().padStart(2, '0');
            let s = date.getUTCSeconds().toString().padStart(2, '0');
            let ms = Math.floor(date.getUTCMilliseconds() / 10).toString().padStart(2, '0');
            return {m, s, ms, str: `${m}:${s}.${ms}`};
        }

        function updateDisplay() {
            const timeObj = formatTime(elapsedTime);
            displayMin.textContent = timeObj.m;
            displaySec.textContent = timeObj.s;
            displayMs.textContent = timeObj.ms;
        }

        function start() {
            if(!running) {
                startTime = Date.now() - elapsedTime;
                timerInterval = requestAnimationFrame(updateTimer);
                running = true;
                
                startBtn.style.display = 'none';
                stopBtn.style.display = 'flex';
                lapBtn.style.display = 'flex';
                resetBtn.style.display = 'none';
            }
        }

        function updateTimer() {
            elapsedTime = Date.now() - startTime;
            updateDisplay();
            if(running) timerInterval = requestAnimationFrame(updateTimer);
        }

        function stop() {
            if(running) {
                running = false;
                cancelAnimationFrame(timerInterval);
                
                startBtn.style.display = 'flex';
                stopBtn.style.display = 'none';
                lapBtn.style.display = 'none';
                resetBtn.style.display = 'flex';
                startBtn.textContent = "Прод.";
            }
        }

        function reset() {
            running = false;
            cancelAnimationFrame(timerInterval);
            elapsedTime = 0;
            lastLapTime = 0;
            laps = [];
            updateDisplay();
            lapsList.innerHTML = '';
            
            startBtn.style.display = 'flex';
            stopBtn.style.display = 'none';
            lapBtn.style.display = 'flex';
            resetBtn.style.display = 'none';
            startBtn.textContent = "Старт";
        }

        function lap() {
            if(running) {
                const currentLapTime = elapsedTime - lastLapTime;
                lastLapTime = elapsedTime;
                const totalTimeStr = formatTime(elapsedTime).str;
                const lapTimeStr = formatTime(currentLapTime).str;
                
                laps.unshift({ total: totalTimeStr, diff: lapTimeStr });
                renderLaps();
            }
        }

        function renderLaps() {
            lapsList.innerHTML = laps.map((l, idx) => `
                <div class="lap-item">
                    <span class="lap-number">Круг ${laps.length - idx}</span>
                    <span class="lap-diff">+${l.diff}</span>
                    <span class="lap-time">${l.total}</span>
                </div>
            `).join('');
        }
    </script>



    <script src="translator.js"></script>
    <script src="ashyq-nav.js"></script>
</body>
</html>
