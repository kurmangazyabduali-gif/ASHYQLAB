<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">

<head>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаборатория: Волны</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .waves-canvas {
            /* Pure black background for additive wave rendering */
            background-color: #000000;
            image-rendering: pixelated;
            /* Sharp pixels for performance feel */
        }
    </style>

    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="lab-waves">
    <div class="app-container">
        <!-- Header -->
        <header class="glass-header">
            <div class="header-left">
                <a href="index.html" class="btn-back" title="В главное меню">⬅</a>
                <h1>Ripple <span class="accent" style="color: #0077ff;">Tank</span></h1>
            </div>
        </header>

        <!-- Main Simulation Area -->
        <main class="simulation-container">
            <canvas id="waves-canvas" class="waves-canvas"></canvas>

            <!-- Floating Controls -->
            <aside class="controls-panel glass-panel">
                <div class="control-group">
                    <h2>Параметры Среды</h2>
                    <label for="damping">Вязкость (Затухание)</label>
                    <input type="range" id="damping" min="0.90" max="0.99" step="0.001" value="0.97">
                </div>

                <div class="control-group">
                    <label for="brush-size">Размер Кисти</label>
                    <input type="range" id="brush-size" min="1" max="10" value="3">
                </div>

                <hr class="divider">

                <div class="control-group checkbox-group">
                    <label for="rain-mode">Режим "Дождь" 🌧️</label>
                    <input type="checkbox" id="rain-mode">
                </div>

                <div class="control-group checkbox-group">
                    <label for="high-quality">Высокое качество (HD)</label>
                    <input type="checkbox" id="high-quality">
                    <!-- Note: Low res by default for performance on all devices -->
                </div>

                <hr class="divider">

                <div class="instruction">
                    <p>�️ Проведите мышкой, чтобы создать волну.</p>
                    <p>Наблюдайте, как волны отражаются от стенок и проходят сквозь друг друга.</p>
                </div>

                <div class="buttons-grid" style="margin-top: 10px;">
                    <button id="btn-clear" class="btn danger" style="grid-column: span 2;">Успокоить воду</button>
                </div>
            </aside>
        </main>
    </div>
    <script src="waves.js"></script>



\n    <script src="ashyq-nav.js"></script>
</body>

</html>
