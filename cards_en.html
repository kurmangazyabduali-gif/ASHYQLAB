<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Matcher — AshyqLab</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: radial-gradient(circle at 10% 20%, #1a1025 0%, #0a0510 100%); 
            color: #fff; 
            font-family: 'Roboto', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 36px; color: #a855f7; text-shadow: 0 0 10px rgba(168,85,247,0.5); margin-bottom: 10px; }
        .header p { color: #d8b4fe; font-size: 16px; }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 800px;
            width: 100%;
            perspective: 1000px;
            margin-bottom: 30px;
        }

        .card {
            background: transparent;
            width: 100%;
            aspect-ratio: 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped { transform: rotateY(180deg); }
        .card.matched { transform: rotateY(180deg) scale(0.95); opacity: 0.8; cursor: default; }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card-front {
            background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(168,85,247,0.05));
            backdrop-filter: blur(10px);
            font-size: 40px;
            color: #d8b4fe;
        }
        .card-front::after { content: '?'; }

        .card-back {
            background: linear-gradient(135deg, #a855f7, #7e22ce);
            transform: rotateY(180deg);
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .stats-hud {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.05);
            padding: 15px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        .stat-box { text-align: center; }
        .stat-val { font-size: 24px; font-weight: 800; color: #a855f7; }
        .stat-lbl { font-size: 12px; color: #a1a1aa; text-transform: uppercase; letter-spacing: 1px; }

        .btn-action {
            background: #a855f7;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(168,85,247,0.4);
        }
        .btn-action:hover { background: #9333ea; transform: translateY(-2px); }

        .btn-back {
            background: rgba(255,255,255,0.1);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 20px;
        }
        .btn-back:hover { background: rgba(255,255,255,0.2); }

        .overlay {
            position: fixed; top: 0; left: 0; w-idth: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.active { opacity: 1; pointer-events: all; }
        .overlay h2 { font-size: 48px; color: #a855f7; margin-bottom: 20px; }

    
/* MOBILE_RESPONSIVE_PATCH */

@media (max-width: 768px) {
    .cards-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; }
}

</style>

    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="header">
        <h1>🧠 Word Memory</h1>
        <p>Match the English words with their Russian translations!</p>
    </div>

    <div class="stats-hud">
        <div class="stat-box">
            <div class="stat-val" id="moves">0</div>
            <div class="stat-lbl">Moves</div>
        </div>
        <div class="stat-box">
            <div class="stat-val" id="matches">0/8</div>
            <div class="stat-lbl">Matches</div>
        </div>
    </div>

    <div class="game-board" id="board"></div>

    <a href="index.html" class="btn-back">← Back to Lobby</a>

    <div class="overlay" id="winScreen">
        <h2>🎉 Level Complete!</h2>
        <p style="margin-bottom: 20px; color: #d8b4fe;" id="winMsg">You found all pairs in 0 moves!</p>
        <button class="btn-action" onclick="initGame()">Play Again</button>
    </div>

    <script>
        const wordPairs = [
            { en: 'Apple', ru: 'Яблоко' }, { en: 'House', ru: 'Дом' },
            { en: 'Friend', ru: 'Друг' }, { en: 'Water', ru: 'Вода' },
            { en: 'Sky', ru: 'Небо' }, { en: 'Book', ru: 'Книга' },
            { en: 'Time', ru: 'Время' }, { en: 'Money', ru: 'Деньги' },
            { en: 'Cat', ru: 'Кот' }, { en: 'Dog', ru: 'Собака' },
            { en: 'Car', ru: 'Машина' }, { en: 'Tree', ru: 'Дерево' }
        ];

        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let isLocked = false;

        function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

        function initGame() {
            document.getElementById('winScreen').classList.remove('active');
            matchedPairs = 0;
            moves = 0;
            updateStats();
            flippedCards = [];
            isLocked = false;
            
            // Pick 8 random pairs
            const selected = shuffle(wordPairs).slice(0, 8);
            cards = [];
            selected.forEach(pair => {
                cards.push({ text: pair.en, id: pair.en, type: 'en' });
                cards.push({ text: pair.ru, id: pair.en, type: 'ru' });
            });
            cards = shuffle(cards);

            const board = document.getElementById('board');
            board.innerHTML = '';
            cards.forEach((card, i) => {
                const el = document.createElement('div');
                el.className = 'card';
                el.dataset.id = card.id;
                el.dataset.index = i;
                el.innerHTML = `
                    <div class="card-face card-front"></div>
                    <div class="card-face card-back">${card.text}</div>
                `;
                el.onclick = () => flipCard(el);
                board.appendChild(el);
            });
        }

        function flipCard(cardEl) {
            if (isLocked) return;
            if (cardEl.classList.contains('flipped')) return;

            cardEl.classList.add('flipped');
            flippedCards.push(cardEl);

            if (flippedCards.length === 2) {
                moves++;
                updateStats();
                checkMatch();
            }
        }

        function checkMatch() {
            isLocked = true;
            const [c1, c2] = flippedCards;
            const isMatch = c1.dataset.id === c2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    c1.classList.add('matched');
                    c2.classList.add('matched');
                    matchedPairs++;
                    updateStats();
                    flippedCards = [];
                    isLocked = false;
                    if (matchedPairs === 8) showWin();
                }, 500);
            } else {
                setTimeout(() => {
                    c1.classList.remove('flipped');
                    c2.classList.remove('flipped');
                    flippedCards = [];
                    isLocked = false;
                }, 1000);
            }
        }

        function updateStats() {
            document.getElementById('moves').textContent = moves;
            document.getElementById('matches').textContent = `${matchedPairs}/8`;
        }

        function showWin() {
            document.getElementById('winScreen').classList.add('active');
            document.getElementById('winMsg').textContent = `You found all pairs in ${moves} moves!`;
        }

        initGame();
    </script>

</body>
</html>
