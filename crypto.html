<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">

<head>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Terminal: Intercept</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --term-green: #0f0;
            --term-bg: #050a05;
            --term-dim: #003300;
        }

        body.lab-lobby {
            background-color: var(--term-bg);
            color: var(--term-green);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
        }

        /* Scanline effect */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 1000;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .terminal-container {
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            gap: 20px;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* PANELS */
        .panel {
            border: 1px solid var(--term-green);
            background: rgba(0, 20, 0, 0.8);
            box-shadow: 0 0 10px var(--term-dim);
            padding: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .panel-header {
            background: var(--term-green);
            color: #000;
            padding: 2px 5px;
            font-weight: bold;
            margin: -15px -15px 15px -15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* LEFT: MISSION LOG */
        .mission-list {
            list-style: none;
            padding: 0;
        }

        .mission-item {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #336633;
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.2s;
        }

        .mission-item.active {
            opacity: 1;
            border-color: var(--term-green);
            background: rgba(0, 255, 0, 0.1);
        }

        .mission-item:hover {
            opacity: 1;
        }

        /* CENTER: DECODER */
        .visualizer-box {
            height: 100px;
            border-bottom: 1px solid var(--term-green);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            background: #000;
        }

        #signal-canvas {
            width: 100%;
            height: 100%;
        }

        .message-screen {
            flex: 1;
            background: #000;
            border: 1px solid #336633;
            padding: 20px;
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 0 5px var(--term-green);
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .tuner-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type=range] {
            flex: 1;
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 10px;
            background: var(--term-green);
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px var(--term-green);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #336633;
        }

        /* RIGHT: KEYPAD */
        .keypad-display {
            background: #001100;
            border: 1px solid #336633;
            color: var(--term-green);
            font-size: 1.5rem;
            padding: 10px;
            text-align: right;
            margin-bottom: 20px;
            height: 40px;
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .key-btn {
            background: transparent;
            border: 1px solid var(--term-green);
            color: var(--term-green);
            padding: 15px;
            font-size: 1.2rem;
            cursor: pointer;
            font-family: inherit;
        }

        .key-btn:hover {
            background: var(--term-green);
            color: #000;
        }

        .key-btn.action {
            grid-column: span 3;
            background: rgba(0, 255, 0, 0.2);
        }

        .status-bar {
            grid-column: span 3;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #66cc66;
            border-top: 1px solid #336633;
            padding-top: 10px;
        }

        /* Glitch animation class */
        .glitch {
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0% {
                transform: translate(0)
            }

            20% {
                transform: translate(-2px, 2px)
            }

            40% {
                transform: translate(-2px, -2px)
            }

            60% {
                transform: translate(2px, 2px)
            }

            80% {
                transform: translate(2px, -2px)
            }

            100% {
                transform: translate(0)
            }
        }

        .back-link {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--term-green);
            text-decoration: none;
            border: 1px solid var(--term-green);
            padding: 5px 10px;
            opacity: 0.5;
            z-index: 2000;
        }

        .back-link:hover {
            opacity: 1;
            background: var(--term-green);
            color: black;
        }
    </style>

    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="lab-lobby">
    <a href="index.html#informatics" class="back-link">ВЫХОД ИЗ ТЕРМИНАЛА</a>

    <div class="terminal-container">

        <!-- LEFT: TASKS -->
        <div class="panel">
            <div class="panel-header">Активные Миссии</div>
            <ul class="mission-list" id="mission-list">
                <!-- Populated by JS -->
            </ul>
            <div style="margin-top: auto; font-size: 0.8rem; color: #448844;">
                АГЕНТ ID: <span id="agent-id">ГОСТЬ</span><br>
                ДОСТУП: УРОВЕНЬ 1
            </div>
        </div>

        <!-- CENTER: DECRYPTER -->
        <div class="panel">
            <div class="panel-header">Перехват Сигнала v4.0</div>

            <div class="visualizer-box">
                <canvas id="signal-canvas"></canvas>
            </div>

            <div class="message-screen" id="message-display">
                ОЖИДАНИЕ СИГНАЛА...
            </div>

            <div class="tuner-container">
                <span id="shift-val">ЧАСТОТА: 0.00</span>
                <input type="range" id="frequency-tuner" min="0" max="25" value="0" step="1">
            </div>

            <div class="status-bar">
                <span>ШИФР: ROT-N</span>
                <span>ЦЕЛОСТНОСТЬ: <span id="integrity-meter">0%</span></span>
            </div>
        </div>

        <!-- RIGHT: KEYPAD INPUT -->
        <div class="panel">
            <div class="panel-header">Взлом Системы</div>
            <p style="font-size:0.8rem; margin-bottom:10px; color:#aaa;">Введите КОД, увиденный в расшифровке:</p>

            <div class="keypad-display" id="keypad-input"></div>

            <div class="keypad-grid">
                <button class="key-btn" onclick="typeKey('1')">1</button>
                <button class="key-btn" onclick="typeKey('2')">2</button>
                <button class="key-btn" onclick="typeKey('3')">3</button>
                <button class="key-btn" onclick="typeKey('4')">4</button>
                <button class="key-btn" onclick="typeKey('5')">5</button>
                <button class="key-btn" onclick="typeKey('6')">6</button>
                <button class="key-btn" onclick="typeKey('7')">7</button>
                <button class="key-btn" onclick="typeKey('8')">8</button>
                <button class="key-btn" onclick="typeKey('9')">9</button>
                <button class="key-btn" style="color:#d44" onclick="typeKey('C')">СБРОС</button>
                <button class="key-btn" onclick="typeKey('0')">0</button>
                <button class="key-btn action" onclick="submitCode()">ВВОД</button>
            </div>
        </div>

    </div>

    <script src="crypto.js"></script>



\n    <script src="ashyq-nav.js"></script>
</body>

</html>
