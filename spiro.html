<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">

<head>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаборатория: Спирограф</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .spiro-canvas {
            background-color: #050510;
        }

        .control-value {
            float: right;
            font-family: monospace;
            color: var(--accent-primary);
        }

        .assistant-box {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--accent-primary);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
        }

        .assistant-header {
            font-size: 0.9em;
            color: var(--accent-primary);
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .assistant-content {
            font-size: 0.85em;
            line-height: 1.4;
            color: #fff;
            min-height: 40px;
        }
    </style>

    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="lab-fractals geo-theme">
    <div class="app-container">
        <header class="glass-header">
            <div class="header-left">
                <a href="index.html#geometry" class="btn-back" title="Назад">⬅</a>
                <h1>Spiro <span class="accent" style="color: #ff9900;">Graph</span></h1>
            </div>
            <div class="header-right">
                <button id="btn-clear" class="btn danger small">Очистить Холст</button>
                <button id="btn-auto" class="btn primary small">Авто-рисунок: Выкл</button>
            </div>
        </header>

        <main class="simulation-container">
            <canvas id="spiro-canvas" class="spiro-canvas"></canvas>

            <aside class="controls-panel glass-panel">
                <!-- ASSISTANT PANEL -->
                <div class="assistant-box">
                    <div class="assistant-header">🤖 Гид по Геометрии</div>
                    <div id="assistant-text" class="assistant-content">
                        Привет! Начни менять параметры, и я объясню, как рождается эта магия.
                    </div>
                </div>
                <hr class="divider">

                <h2>Параметры</h2>

                <div class="control-group">
                    <label>Радиус А (Статор) <span id="val-R" class="control-value">150</span></label>
                    <input type="range" id="input-R" min="50" max="300" value="150">
                </div>

                <div class="control-group">
                    <label>Радиус B (Ротор) <span id="val-r" class="control-value">52</span></label>
                    <input type="range" id="input-r" min="2" max="150" value="52">
                </div>

                <div class="control-group">
                    <label>Смещение Точки (d) <span id="val-d" class="control-value">60</span></label>
                    <input type="range" id="input-d" min="10" max="150" value="60">
                </div>

                <div class="control-group">
                    <label>Скорость</label>
                    <input type="range" id="input-speed" min="1" max="50" value="10">
                </div>

                <div class="control-group">
                    <label>Цвет (Hue)</label>
                    <input type="range" id="input-color" min="0" max="360" value="180">
                </div>

                <hr class="divider">

                <div class="instruction">
                    <p>⚙️ <b>Как это работает?</b><br>
                        Маленькая шестеренка катится внутри большой. Точка ручки смещена от центра.</p>
                    <p style="margin-top:10px; opacity: 0.7; font-size: 0.8em">Формула:
                        x = (R-r)*cos(t) + d*cos((R-r)/r*t)</p>
                </div>

                <div id="stats-panel" style="margin-top: 20px; font-family: monospace; font-size: 0.8rem; opacity: 0.6">
                    Оборотов: <span id="stat-cycles">0</span>
                </div>
            </aside>
        </main>
    </div>
    <script src="spiro.js"></script>



\n    <script src="ashyq-nav.js"></script>
</body>

</html>
