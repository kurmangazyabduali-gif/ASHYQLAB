<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Scramble Game — AshyqLab</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: linear-gradient(135deg, #166534 0%, #064e3b 100%); 
            color: #fff; 
            font-family: 'Roboto', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 40px; color: #4ade80; text-shadow: 0 0 15px rgba(74,222,128,0.5); font-weight: 900; }
        .header p { color: #bbf7d0; font-size: 18px; }

        .game-panel {
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(74,222,128,0.3);
            border-radius: 20px;
            padding: 40px;
            width: 100%; max-width: 600px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .hint { font-size: 20px; color: #86efac; margin-bottom: 25px; font-style: italic; }

        .scrambled-letters {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 30px;
        }
        .letter {
            width: 50px; height: 50px; background: rgba(74,222,128,0.15);
            border: 2px solid #4ade80; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 900; color: #fff;
            box-shadow: 0 4px 0 #166534; transform: translateY(0);
        }
        
        .input-group { margin-bottom: 20px; position: relative; }
        .word-input {
            width: 100%; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.2);
            padding: 15px 20px; font-size: 24px; color: white; border-radius: 12px;
            text-align: center; font-family: inherit; font-weight: 700;
            text-transform: uppercase; letter-spacing: 5px; transition: 0.3s;
        }
        .word-input:focus { outline: none; border-color: #4ade80; box-shadow: 0 0 15px rgba(74,222,128,0.4); }
        .word-input.error { border-color: #ef4444; animation: shake 0.4s; }

        .timer-bar-bg { width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; margin-bottom: 10px; }
        .timer-bar-fill { height: 100%; background: #4ade80; width: 100%; transition: width 0.1s linear, background-color 0.3s; }

        .btn-check {
            background: #4ade80; color: #064e3b; border: none; padding: 15px 30px;
            font-size: 20px; font-weight: 900; border-radius: 12px; cursor: pointer;
            transition: all 0.2s; font-family: inherit; margin-top: 10px;
        }
        .btn-check:hover { background: #22c55e; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(74,222,128,0.4); }

        .btn-back { display: block; width: max-content; margin: 30px auto 0; background: rgba(255,255,255,0.1); color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; transition: all 0.3s; }
        .btn-back:hover { background: rgba(255,255,255,0.2); }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .score-hud { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 20px; font-weight: bold; }
    
/* MOBILE_RESPONSIVE_PATCH */

@media (max-width: 600px) {
    body { padding: 12px 10px !important; }
    .quiz-card { padding: 16px 12px !important; }
    .word-box { font-size: 1.4rem !important; }
    .options { grid-template-columns: 1fr !important; gap: 8px !important; }
}

</style>

    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="header">
        <h1>🌪️ Word Scramble</h1>
        <p>Unscramble the letters to find the correct word before time runs out!</p>
    </div>

    <div class="game-panel">
        <div class="score-hud">
            <span>Score: <span id="score" style="color:#4ade80;">0</span></span>
            <span>Level: <span id="level">1</span></span>
        </div>

        <div class="timer-bar-bg"><div class="timer-bar-fill" id="timerFill"></div></div>
        
        <div class="hint" id="hintBox">"Hint goes here"</div>
        <div class="scrambled-letters" id="scrambleBox"></div>

        <div class="input-group">
            <input type="text" class="word-input" id="wordInput" placeholder="TYPE HERE..." autocomplete="off">
        </div>
        
        <button class="btn-check" onclick="checkWord()">SUBMIT</button>
    </div>

    <a href="index.html" class="btn-back">← Back to Lobby</a>

    <script>
        const words = [
            { w: 'SCIENCE', h: 'Study of the physical and natural world' },
            { w: 'GRAVITY', h: 'Force that draws objects together' },
            { w: 'COMPUTER', h: 'Electronic machine for processing data' },
            { w: 'PYTHON', h: 'A snake, or a programming language' },
            { w: 'BIOLOGY', h: 'Study of living organisms' },
            { w: 'UNIVERSE', h: 'All existing matter and space' },
            { w: 'CHEMISTRY', h: 'Study of elements and compounds' },
            { w: 'ENERGY', h: 'Capacity to do work' },
            { w: 'GENETICS', h: 'Study of heredity and inherited traits' },
            { w: 'ASTRONOMY', h: 'Study of space and celestial bodies' }
        ];

        let currentWord = {};
        let score = 0;
        let level = 1;
        let timeLeft = 100; // percentage
        let timerInterval;

        function shuffle(str) {
            let arr = str.split('');
            for(let i = arr.length - 1; i > 0; i--){
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            // Ensure it's not the same
            if (arr.join('') === str && str.length > 1) return shuffle(str);
            return arr.join('');
        }

        function startGame() {
            score = 0; level = 1;
            document.getElementById('score').textContent = score;
            nextWord();
        }

        function nextWord() {
            document.getElementById('level').textContent = level;
            currentWord = words[Math.floor(Math.random() * words.length)];
            const scrambled = shuffle(currentWord.w);
            
            document.getElementById('hintBox').textContent = `"${currentWord.h}"`;
            
            const box = document.getElementById('scrambleBox');
            box.innerHTML = '';
            scrambled.split('').forEach(l => {
                const span = document.createElement('div');
                span.className = 'letter';
                span.textContent = l;
                box.appendChild(span);
            });

            const input = document.getElementById('wordInput');
            input.value = '';
            input.classList.remove('error');
            input.focus();

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 100;
            const fill = document.getElementById('timerFill');
            fill.style.width = '100%';
            fill.style.backgroundColor = '#4ade80';

            const speed = Math.max(20, 100 - (level * 5)); // gets faster

            timerInterval = setInterval(() => {
                timeLeft -= 0.5;
                fill.style.width = timeLeft + '%';
                if (timeLeft < 30) fill.style.backgroundColor = '#ef4444';
                else if (timeLeft < 60) fill.style.backgroundColor = '#facc15';

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert(`Time's up! The word was ${currentWord.w}. Final Score: ${score}`);
                    startGame();
                }
            }, speed);
        }

        function checkWord() {
            const input = document.getElementById('wordInput');
            const val = input.value.trim().toUpperCase();

            if (val === currentWord.w) {
                // correct
                clearInterval(timerInterval);
                input.style.borderColor = '#4ade80';
                score += (10 * level) + Math.floor(timeLeft);
                level++;
                document.getElementById('score').textContent = score;
                setTimeout(() => {
                    input.style.borderColor = '';
                    nextWord();
                }, 500);
            } else {
                // wrong
                input.classList.add('error');
                setTimeout(() => input.classList.remove('error'), 400);
            }
        }

        document.getElementById('wordInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkWord();
        });

        startGame();
    </script>



\n    <script src="ashyq-nav.js"></script>
</body>
</html>
