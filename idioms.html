<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idiom Detective — AshyqLab</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body { 
            background: radial-gradient(circle at 50% 100%, #3f2b96 0%, #03001e 100%); 
            color: #fff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 44px; color: #fbbf24; text-shadow: 0 0 15px rgba(251,191,36,0.4); margin-bottom: 5px; }
        .header p { color: #d1d5db; font-size: 18px; }

        .detective-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%; max-width: 700px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            position: relative;
        }

        .case-title { font-size: 14px; text-transform: uppercase; color: #fbbf24; letter-spacing: 2px; margin-bottom: 10px; font-weight: 800; }
        .scenario { font-size: 24px; line-height: 1.5; margin-bottom: 30px; border-left: 4px solid #fbbf24; padding-left: 20px; font-weight: 300; }

        .options { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .idiom-btn {
            background: rgba(0,0,0,0.4); border: 2px solid rgba(251,191,36,0.3);
            color: white; font-size: 18px; padding: 15px 20px;
            border-radius: 12px; cursor: pointer; transition: all 0.2s;
            text-align: left; font-weight: 600;
        }
        .idiom-btn:hover { background: rgba(251,191,36,0.1); border-color: #fbbf24; transform: translateX(5px); }
        .idiom-btn.correct { background: rgba(74,222,128,0.2) !important; border-color: #4ade80 !important; color: #4ade80; }
        .idiom-btn.wrong { background: rgba(239,68,68,0.2) !important; border-color: #ef4444 !important; color: #ef4444; }

        .progress { position: absolute; top: 40px; right: 40px; font-size: 18px; color: #9ca3af; font-weight: bold; }

        .btn-back { display: block; width: max-content; margin: 30px auto 0; background: rgba(255,255,255,0.1); color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; transition: all 0.3s; }
        .btn-back:hover { background: rgba(255,255,255,0.2); }

        .explanation {
            margin-top: 20px; background: rgba(74,222,128,0.1); padding: 15px; border-radius: 10px;
            border-left: 4px solid #4ade80; display: none; margin-bottom: 15px;
        }

        .next-btn {
            display: none; width: 100%; background: #fbbf24; color: #000; border: none;
            padding: 15px; border-radius: 10px; font-size: 18px; font-weight: 800; cursor: pointer;
            margin-top: 20px;
        }
    
/* MOBILE_RESPONSIVE_PATCH */

@media (max-width: 600px) {
    body { padding: 12px 10px !important; }
    .card { padding: 16px 12px !important; }
    .options { gap: 8px !important; }
}

</style>

    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="header">
        <h1>🕵️ Idiom Detective</h1>
        <p>Analyze the scenario and choose the idiom that fits best!</p>
    </div>

    <div class="detective-card">
        <div class="progress" id="progressTxt">Case 1/5</div>
        <div class="case-title">🔍 Scenario File</div>
        <div class="scenario" id="scenarioTxt">Loading case details...</div>

        <div class="options" id="optionsBox"></div>

        <div class="explanation" id="explanationBox"></div>
        <button class="next-btn" id="nextBtn" onclick="nextCase()">Next Case ➡️</button>
    </div>

    <a href="index.html" class="btn-back">← Back to Headquarters</a>

    <script>
        const cases = [
            {
                s: "Tom has been working on his project from 8 AM until 2 AM every day this week to meet the deadline.",
                opts: ["Burning the midnight oil", "Barking up the wrong tree", "Cutting corners", "Biting the bullet"],
                ans: 0,
                exp: "To 'burn the midnight oil' means to work late into the night."
            },
            {
                s: "Sarah is trying to find a job by sending her acting resume to accounting firms.",
                opts: ["Spilling the beans", "Barking up the wrong tree", "Under the weather", "Costing an arm and a leg"],
                ans: 1,
                exp: "To 'bark up the wrong tree' means to pursue a false lead or make a mistake in your line of thought."
            },
            {
                s: "The Ferrari that John bought last week was ridiculously expensive.",
                opts: ["A piece of cake", "Once in a blue moon", "Cost an arm and a leg", "A blessing in disguise"],
                ans: 2,
                exp: "If something 'costs an arm and a leg', it is extremely expensive."
            },
            {
                s: "Mary kept avoiding the main topic of conversation during the meeting by talking about irrelevant things.",
                opts: ["Beating around the bush", "Hitting the nail on the head", "Biting the bullet", "Letting the cat out of the bag"],
                ans: 0,
                exp: "To 'beat around the bush' means to avoid getting to the point of an issue."
            },
            {
                s: "At first, missing the flight seemed terrible, but it resulted in him meeting his future wife at the airport café.",
                opts: ["A piece of cake", "A blessing in disguise", "Stealing someone's thunder", "On the ball"],
                ans: 1,
                exp: "'A blessing in disguise' is a good thing that initially seemed bad."
            }
        ];

        let currentCaseIdx = 0;
        let score = 0;

        function loadCase() {
            if(currentCaseIdx >= cases.length) {
                document.getElementById('scenarioTxt').innerHTML = `All cases closed! 🏆 <br><br>Final Score: ${score}/${cases.length}`;
                document.getElementById('optionsBox').style.display = 'none';
                document.getElementById('progressTxt').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'none';
                document.getElementById('explanationBox').style.display = 'none';
                return;
            }

            const data = cases[currentCaseIdx];
            document.getElementById('progressTxt').textContent = `Case ${currentCaseIdx + 1}/${cases.length}`;
            document.getElementById('scenarioTxt').textContent = `"${data.s}"`;
            
            const box = document.getElementById('optionsBox');
            box.style.display = 'grid';
            box.innerHTML = '';
            
            data.opts.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'idiom-btn';
                btn.textContent = opt;
                btn.onclick = () => selectOpt(i, btn);
                box.appendChild(btn);
            });

            document.getElementById('explanationBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function selectOpt(idx, btn) {
            const data = cases[currentCaseIdx];
            const buttons = document.querySelectorAll('.idiom-btn');
            buttons.forEach(b => b.style.pointerEvents = 'none'); // lock

            if (idx === data.ans) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                buttons[data.ans].classList.add('correct');
            }

            const expBox = document.getElementById('explanationBox');
            expBox.textContent = data.exp;
            expBox.style.display = 'block';

            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextCase() {
            currentCaseIdx++;
            loadCase();
        }

        loadCase();
    </script>



\n    <script src="ashyq-nav.js"></script>
</body>
</html>
