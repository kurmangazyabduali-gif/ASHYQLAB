<!DOCTYPE html>
<html lang="ru" translate="no" class="notranslate">

<head>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаборатория: Оптика</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Optics Specific Styles */
        .optics-canvas {
            background-color: #000;
            /* Pitch black for best contrast */
            box-shadow: inset 0 0 50px rgba(0, 255, 157, 0.1);
        }
    </style>

    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="lab-optics">
    <div class="app-container">
        <!-- Header -->
        <header class="glass-header">
            <div class="header-left">
                <a href="index.html" class="btn-back" title="В главное меню">⬅</a>
                <h1>Ray <span class="accent" style="color: #00ff9d;">Optics</span></h1>
            </div>
            <div class="stats">
                <div class="stat-item">Лучей: <span id="ray-count">0</span></div>
            </div>
        </header>

        <!-- Main Simulation Area -->
        <main class="simulation-container">
            <canvas id="optics-canvas" class="optics-canvas"></canvas>

            <div id="victory-modal" class="victory-modal">
                <h2>Победа! 🎯</h2>
                <p>Луч достиг цели.</p>
                <button id="btn-next-level" class="btn primary" style="margin-top: 1rem;">Следующий Уровень ➡</button>
            </div>

            <!-- Controls -->
            <aside class="controls-panel glass-panel">
                <div class="control-group header-group">
                    <h2>Инструменты</h2>
                    <div class="toggle-group" id="tool-group">
                        <button class="btn toggle-btn active" data-tool="laser" title="Лазер">🔦</button>
                        <button class="btn toggle-btn" data-tool="mirror" title="Зеркало">🪞</button>
                        <button class="btn toggle-btn" data-tool="wall" title="Стена (Поглотитель)">🧱</button>
                    </div>
                </div>

                <div class="control-group">
                    <h2>Цвет Лазера</h2>
                    <input type="color" id="laser-color" value="#ff0000"
                        style="width:100%; height:40px; border:none; background:transparent; cursor:pointer;">
                </div>

                <div class="control-group checkbox-group">
                    <label for="show-normals">Показать нормали</label>
                    <input type="checkbox" id="show-normals">
                </div>

                <hr class="divider">

                <div id="level-indicator" class="level-indicator">Уровень 1</div>
                <button id="btn-challenge" class="btn primary"
                    style="width: 100%; margin-bottom: 10px; background: linear-gradient(45deg, #ff0055, #ff9900);">🎯
                    Режим Испытаний</button>

                <div class="instruction">
                    <p>🔦 <b>Лазер:</b> Кликните и тяните, чтобы задать направление.</p>
                    <p>🪞 <b>Зеркало:</b> Рисуйте линии, от которых отражается свет.</p>
                </div>

                <div class="buttons-grid" style="margin-top: 10px;">
                    <button id="btn-clear" class="btn danger" style="grid-column: span 2;">Очистить Всё</button>
                </div>
            </aside>
        </main>
    </div>
    <script src="optics.js"></script>



\n    <script src="ashyq-nav.js"></script>
</body>

</html>
